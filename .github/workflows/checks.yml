name: Mathematical checks
on: [push, pull_request]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m experiments.reproduce --check results/data/small_cases.json
      - run: python -m experiments.sparse_rainbow --check results/data/sparse_rainbow.json
