name: Mathematical checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reproduce:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m tools.verify_repository --static-only
      - run: python -m experiments.reproduce --check results/data/small_cases.json
      - run: python -m experiments.sparse_rainbow --check results/data/sparse_rainbow.json
      - run: python -m experiments.classify_cube --check results/data/cube_classification.json
      - run: python -m experiments.cube_collision_audit --check results/data/cube_collisions.json
      - run: python -m experiments.random_rainbow --check results/data/random_rainbow.json
      - run: python -m experiments.cycle_unions --check results/data/cycle_unions.json
      - run: python -m experiments.rainbow_inclusion_exclusion --check results/data/rainbow_inclusion_exclusion.json
